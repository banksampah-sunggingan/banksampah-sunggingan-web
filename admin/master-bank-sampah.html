<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Bank Sampah · Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { 'sans': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] }, colors: { 'hijau': { 50: '#F1F8F3', 100: '#DFF0E4', 200: '#B7DDC1', 300: '#8AC59A', 400: '#5FA773', 500: '#3A7D44', 600: '#2D5F3F', 700: '#254D33', 800: '#1E3F2A', 900: '#183321' } } } } }
  </script>
</head>
<body class="font-sans bg-gray-50 min-h-screen">

  <div id="loadingState" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-hijau-200 border-t-hijau-500 rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-hijau-700 font-medium">Memuat data...</p>
    </div>
  </div>

  <div id="mainContent" class="hidden">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
      <div class="px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-hijau-500 rounded-lg flex items-center justify-center"><span class="text-white font-bold text-sm">BS</span></div>
          <div><div class="font-bold text-hijau-800 text-sm leading-tight">Bank Sampah Sunggingan</div><div class="text-gray-500 text-xs">Master Bank Sampah</div></div>
        </div>
        <div class="flex items-center gap-4">
          <div class="text-right"><div class="font-semibold text-gray-800 text-sm" id="userName">-</div><div class="text-xs text-gray-500" id="userRole">-</div></div>
          <button id="logoutBtn" class="flex items-center gap-1 text-hijau-700 hover:text-hijau-800 hover:bg-hijau-50 px-3 py-2 rounded-lg text-sm font-semibold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Keluar
          </button>
        </div>
      </div>
    </header>

    <div class="flex">
      <aside class="w-60 bg-white border-r border-gray-200 min-h-[calc(100vh-64px)] sticky top-16">
        <nav class="p-3 space-y-1" id="sidebar-nav"></nav>
      </aside>

      <main class="flex-1 p-6">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-gray-800">Master Bank Sampah</h1>
          <p class="text-sm text-gray-500 mt-0.5">Kelola informasi 6 bank sampah Kelurahan Sunggingan</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" id="bsCards"></div>
      </main>
    </div>
  </div>

  <div id="modalEdit" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white max-w-lg w-full rounded-2xl max-h-[90vh] overflow-y-auto">
      <div class="p-5 border-b border-gray-200 flex items-center justify-between sticky top-0 bg-white">
        <h2 class="text-lg font-bold text-hijau-800" id="modalTitle">Edit Bank Sampah</h2>
        <button id="btnClose" class="text-gray-500 hover:text-gray-700 p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="editForm" class="p-5 space-y-3">
        <input type="hidden" id="fId">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">RW</label>
            <input type="text" id="fRW" readonly class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg text-sm text-gray-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Status <span class="text-red-500">*</span></label>
            <select id="fStatus" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-hijau-500">
              <option value="rintisan">Rintisan</option>
              <option value="ber_sk">Ber-SK</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Bank Sampah <span class="text-red-500">*</span></label>
          <input type="text" id="fNama" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-hijau-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat</label>
          <textarea id="fAlamat" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-hijau-500"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Ketua</label>
            <input type="text" id="fKetuaNama" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-hijau-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">No HP Ketua</label>
            <input type="tel" id="fKetuaHP" placeholder="08xxxxxxxxxx" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-hijau-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">No SK</label>
            <input type="text" id="fNoSK" placeholder="Kosongkan jika belum" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-hijau-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Tanggal SK</label>
            <input type="date" id="fTglSK" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-hijau-500">
          </div>
        </div>
        <div id="formError" class="hidden bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-sm"></div>
        <div class="flex gap-2 pt-2">
          <button type="button" id="btnCancel" class="flex-1 py-2.5 border border-gray-300 text-gray-700 rounded-lg font-semibold text-sm hover:bg-gray-50">Batal</button>
          <button type="submit" id="btnSave" class="flex-1 py-2.5 bg-hijau-500 hover:bg-hijau-600 text-white rounded-lg font-semibold text-sm disabled:opacity-50">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '/shared/config.js';
    import { formatRp, showToast, formatTanggal } from '/shared/utils.js';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

    let allBS = [];

    function renderSidebar() {
      document.getElementById('sidebar-nav').innerHTML = `
        <a href="/admin/dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </a>
        <a href="/admin/rekap-per-rw.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Rekap per RW
        </a>
        <a href="/admin/rekap-pkk.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Rekap PKK Bulanan
        </a>
        <a href="/admin/rekap-tahunan.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Rekap Tahunan
        </a>
        <a href="/admin/pencairan-lebaran.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          Pencairan Lebaran
        </a>
        <div class="pt-3 mt-3 border-t border-gray-200">
          <div class="text-xs font-semibold text-gray-400 uppercase px-3 mb-2">Master Data</div>
          <a href="/admin/master-bank-sampah.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-hijau-100 text-hijau-800 font-semibold text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            Bank Sampah
          </a>
          <a href="/admin/master-nasabah.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            Nasabah
          </a>
        </div>
        <div class="pt-3 mt-3 border-t border-gray-200">
          <a href="/admin/audit-log.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m-7 5h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            Audit Log
          </a>
        </div>
      `;
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return window.location.href = '/login.html';
      const { data: petugas, error } = await supabase.from('petugas').select('*').eq('id', session.user.id).single();
      if (error || !petugas || !['admin_desa', 'koordinator_pkk'].includes(petugas.role)) {
        alert('Akses tidak valid.');
        await supabase.auth.signOut();
        return window.location.href = '/login.html';
      }
      document.getElementById('userName').textContent = petugas.nama;
      document.getElementById('userRole').textContent = petugas.role === 'admin_desa' ? 'Admin Desa' : 'Koordinator PKK';
      renderSidebar();
      await loadData();
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
    }

    async function loadData() {
      const { data: bsData } = await supabase.from('bank_sampah').select('*').is('deleted_at', null).order('rw');
      allBS = bsData || [];
      const { data: petugasData } = await supabase.from('petugas').select('bank_sampah_id, nama, role, aktif').eq('aktif', true);
      const petugasPerBS = {};
      (petugasData || []).forEach(p => {
        if (!p.bank_sampah_id) return;
        if (!petugasPerBS[p.bank_sampah_id]) petugasPerBS[p.bank_sampah_id] = [];
        petugasPerBS[p.bank_sampah_id].push(p);
      });

      const container = document.getElementById('bsCards');
      container.innerHTML = '';
      allBS.forEach(bs => {
        const petugasList = petugasPerBS[bs.id] || [];
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden';
        const statusBadge = bs.status === 'ber_sk' 
          ? '<span class="text-xs bg-hijau-100 text-hijau-700 px-2 py-1 rounded font-medium">Ber-SK</span>'
          : '<span class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded font-medium">Rintisan</span>';
        card.innerHTML = `
          <div class="p-4 bg-gradient-to-r from-hijau-500 to-hijau-600 text-white flex items-center justify-between">
            <div>
              <div class="font-bold text-lg">RW ${bs.rw} · Bank Sampah ${escapeHtml(bs.nama)}</div>
              <div class="text-xs text-hijau-100 mt-0.5">${bs.alamat ? escapeHtml(bs.alamat) : 'Alamat belum diisi'}</div>
            </div>
            ${statusBadge}
          </div>
          <div class="p-4 grid grid-cols-2 gap-3 text-sm">
            <div>
              <div class="text-xs text-gray-500 font-semibold mb-1">Ketua</div>
              <div class="text-gray-800">${bs.ketua_nama ? escapeHtml(bs.ketua_nama) : '<span class="text-gray-400 italic">Belum diisi</span>'}</div>
            </div>
            <div>
              <div class="text-xs text-gray-500 font-semibold mb-1">No HP Ketua</div>
              <div class="text-gray-800">${bs.ketua_no_hp ? escapeHtml(bs.ketua_no_hp) : '<span class="text-gray-400 italic">Belum diisi</span>'}</div>
            </div>
            <div>
              <div class="text-xs text-gray-500 font-semibold mb-1">No SK</div>
              <div class="text-gray-800">${bs.no_sk ? escapeHtml(bs.no_sk) : '<span class="text-gray-400 italic">Belum ada</span>'}</div>
            </div>
            <div>
              <div class="text-xs text-gray-500 font-semibold mb-1">Tanggal SK</div>
              <div class="text-gray-800">${bs.tanggal_sk ? formatTanggal(bs.tanggal_sk) : '<span class="text-gray-400 italic">Belum ada</span>'}</div>
            </div>
          </div>
          <div class="px-4 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-between">
            <div class="text-xs text-gray-600">
              <span class="font-semibold">${petugasList.length}</span> petugas aktif
              ${petugasList.length > 0 ? ` · ${petugasList.map(p => escapeHtml(p.nama)).join(', ')}` : ''}
            </div>
            <button data-id="${bs.id}" class="btn-edit text-hijau-700 hover:text-hijau-800 font-semibold text-sm px-3 py-1 border border-hijau-300 rounded hover:bg-hijau-50">Edit Info</button>
          </div>
        `;
        container.appendChild(card);
      });
      document.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => openEdit(btn.dataset.id));
      });
    }

    function openEdit(id) {
      const bs = allBS.find(b => b.id === id);
      if (!bs) return;
      document.getElementById('modalTitle').textContent = `Edit Bank Sampah ${bs.nama}`;
      document.getElementById('fId').value = bs.id;
      document.getElementById('fRW').value = bs.rw;
      document.getElementById('fNama').value = bs.nama || '';
      document.getElementById('fAlamat').value = bs.alamat || '';
      document.getElementById('fStatus').value = bs.status;
      document.getElementById('fKetuaNama').value = bs.ketua_nama || '';
      document.getElementById('fKetuaHP').value = bs.ketua_no_hp || '';
      document.getElementById('fNoSK').value = bs.no_sk || '';
      document.getElementById('fTglSK').value = bs.tanggal_sk || '';
      document.getElementById('formError').classList.add('hidden');
      document.getElementById('modalEdit').classList.remove('hidden');
    }

    document.getElementById('btnClose').addEventListener('click', () => document.getElementById('modalEdit').classList.add('hidden'));
    document.getElementById('btnCancel').addEventListener('click', () => document.getElementById('modalEdit').classList.add('hidden'));

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('fId').value;
      const payload = {
        nama: document.getElementById('fNama').value.trim(),
        alamat: document.getElementById('fAlamat').value.trim() || null,
        status: document.getElementById('fStatus').value,
        ketua_nama: document.getElementById('fKetuaNama').value.trim() || null,
        ketua_no_hp: document.getElementById('fKetuaHP').value.trim() || null,
        no_sk: document.getElementById('fNoSK').value.trim() || null,
        tanggal_sk: document.getElementById('fTglSK').value || null,
      };
      const errEl = document.getElementById('formError');
      if (!payload.nama) {
        errEl.textContent = 'Nama wajib diisi.';
        errEl.classList.remove('hidden');
        return;
      }
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      const { error } = await supabase.from('bank_sampah').update(payload).eq('id', id);
      if (error) {
        errEl.textContent = 'Gagal: ' + error.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Simpan';
        return;
      }
      showToast('Data bank sampah diperbarui', 'success');
      document.getElementById('modalEdit').classList.add('hidden');
      await loadData();
      btn.disabled = false;
      btn.textContent = 'Simpan';
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); window.location.href = '/login.html'; });
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text ?? ''; return div.innerHTML; }
    init();
  </script>
</body>
</html>
