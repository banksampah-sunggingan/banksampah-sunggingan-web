<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Bank Sampah Sunggingan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 'sans': ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: {
            'hijau': {
              50: '#F1F8F3', 100: '#DFF0E4', 200: '#B7DDC1', 300: '#8AC59A',
              400: '#5FA773', 500: '#3A7D44', 600: '#2D5F3F', 700: '#254D33',
              800: '#1E3F2A', 900: '#183321',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-hijau-50 min-h-screen">

  <!-- Loading -->
  <div id="loadingState" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-hijau-200 border-t-hijau-500 rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-hijau-700 font-medium">Memuat dashboard...</p>
    </div>
  </div>

  <div id="mainContent" class="hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-hijau-100 sticky top-0 z-40">
      <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-hijau-500 rounded-lg flex items-center justify-center">
            <span class="text-white font-bold text-sm">BS</span>
          </div>
          <div>
            <div class="font-bold text-hijau-800 text-sm leading-tight" id="bankSampahName">Bank Sampah</div>
            <div class="text-hijau-600 text-xs" id="userName">Petugas</div>
          </div>
        </div>
        <button id="logoutBtn" class="text-hijau-700 hover:text-hijau-800 text-sm font-semibold px-3 py-2">
          Keluar
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">

      <!-- Greeting card -->
      <div class="bg-gradient-to-br from-hijau-500 to-hijau-600 rounded-2xl p-6 text-white mb-6 shadow-md">
        <div class="text-hijau-100 text-sm mb-1" id="todayDate">Hari ini</div>
        <h1 class="text-2xl font-bold mb-1">Selamat datang, <span id="welcomeName">Petugas</span></h1>
        <p class="text-hijau-100 text-sm" id="welcomeBankSampah">Bank Sampah</p>
      </div>

      <!-- Quick stats -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-hijau-100">
          <div class="text-xs text-gray-500 font-medium mb-1">Total Nasabah</div>
          <div class="text-2xl font-bold text-hijau-800" id="statNasabah">-</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border border-hijau-100">
          <div class="text-xs text-gray-500 font-medium mb-1">Jenis Sampah</div>
          <div class="text-2xl font-bold text-hijau-800" id="statJenisSampah">-</div>
        </div>
      </div>

      <!-- Menu utama -->
      <div class="mb-4">
        <h2 class="font-bold text-hijau-800 text-lg mb-3">Menu Utama</h2>
        <div class="grid grid-cols-2 gap-3">

          <a href="/petugas/nasabah.html" class="bg-white rounded-xl p-5 shadow-sm border border-hijau-100 hover:shadow-md hover:border-hijau-300 transition group">
            <div class="w-11 h-11 bg-hijau-100 rounded-lg flex items-center justify-center mb-3 group-hover:bg-hijau-200 transition">
              <svg class="w-6 h-6 text-hijau-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
              </svg>
            </div>
            <div class="font-bold text-hijau-800 text-sm">Nasabah</div>
            <div class="text-xs text-gray-500 mt-0.5">Kelola daftar nasabah</div>
          </a>

            <a href="/petugas/input-transaksi.html" class="bg-white rounded-xl p-5 shadow-sm border border-hijau-100 hover:shadow-md hover:border-hijau-300 transition group">
            <div class="w-11 h-11 bg-hijau-100 rounded-lg flex items-center justify-center mb-3 group-hover:bg-hijau-200 transition">
                <svg class="w-6 h-6 text-hijau-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                </svg>
            </div>
            <div class="font-bold text-hijau-800 text-sm">Input Transaksi</div>
            <div class="text-xs text-gray-500 mt-0.5">Terima setoran nasabah</div>
            </a>

            <a href="/petugas/master-harga.html" class="bg-white rounded-xl p-5 shadow-sm border border-hijau-100 hover:shadow-md hover:border-hijau-300 transition group">
            <div class="w-11 h-11 bg-hijau-100 rounded-lg flex items-center justify-center mb-3 group-hover:bg-hijau-200 transition">
                <svg class="w-6 h-6 text-hijau-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <div class="font-bold text-hijau-800 text-sm">Master Harga</div>
            <div class="text-xs text-gray-500 mt-0.5">Kelola harga sampah</div>
            </a>
            
          <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-200 opacity-60 cursor-not-allowed">
            <div class="w-11 h-11 bg-gray-100 rounded-lg flex items-center justify-center mb-3">
              <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2a4 4 0 014-4h4m0 0V7a4 4 0 00-4-4H9a4 4 0 00-4 4v6a4 4 0 004 4h4z"/>
              </svg>
            </div>
            <div class="font-bold text-gray-600 text-sm">Rekap Sesi</div>
            <div class="text-xs text-gray-500 mt-0.5">Segera hadir</div>
          </div>

        </div>
      </div>

    </main>

  </div>

  <script type="module">
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '/shared/config.js';
    import { formatTanggal } from '/shared/utils.js';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/login.html';
        return;
      }

      const { data: petugas, error } = await supabase
        .from('petugas')
        .select('*, bank_sampah(*)')
        .eq('id', session.user.id)
        .single();

      if (error || !petugas || petugas.role !== 'petugas_rw') {
        alert('Akses tidak valid.');
        await supabase.auth.signOut();
        window.location.href = '/login.html';
        return;
      }

      // Populate UI
      document.getElementById('userName').textContent = petugas.nama;
      document.getElementById('welcomeName').textContent = petugas.nama;
      document.getElementById('bankSampahName').textContent = 'Bank Sampah ' + (petugas.bank_sampah?.nama || '-');
      document.getElementById('welcomeBankSampah').textContent = 'Bank Sampah ' + (petugas.bank_sampah?.nama || '-') + ' · RW ' + (petugas.bank_sampah?.rw || '-');
      document.getElementById('todayDate').textContent = formatTanggal(new Date().toISOString());

      // Load stats
      const bankSampahId = petugas.bank_sampah?.id;
      if (bankSampahId) {
        // Total nasabah (exclude default & deleted)
        const { count: nasabahCount } = await supabase
          .from('nasabah')
          .select('*', { count: 'exact', head: true })
          .eq('bank_sampah_id', bankSampahId)
          .eq('is_default', false)
          .is('deleted_at', null);
        document.getElementById('statNasabah').textContent = nasabahCount ?? 0;

        // Total jenis sampah
        const { count: jenisCount } = await supabase
          .from('jenis_sampah')
          .select('*', { count: 'exact', head: true })
          .eq('bank_sampah_id', bankSampahId)
          .eq('aktif', true)
          .is('deleted_at', null);
        document.getElementById('statJenisSampah').textContent = jenisCount ?? 0;
      }

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/login.html';
    });

    init();
  </script>

</body>
</html>
